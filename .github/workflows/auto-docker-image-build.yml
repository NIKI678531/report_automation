name: Build ECR Images
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target AWS environment
        type: choice
        required: true
        options: [uat, prd]
permissions:
  contents: read
concurrency:
  group: ecr-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: srvapp
            context: ./backend
            dockerfile: backend/Dockerfile
          - component: webapp
            context: .
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-east-1
          allowed-account-ids: ${{ inputs.environment == 'prd' && '449732370091' || '978533598453' }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: login
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.login.outputs.registry }}/ih-${{ inputs.environment }}-remote-fund-cmt-auto-${{ matrix.component }}:latest
            ${{ steps.login.outputs.registry }}/ih-${{ inputs.environment }}-remote-fund-cmt-auto-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
