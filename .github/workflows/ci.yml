name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    # The suite runs on SQLite, which accepts DDL that InnoDB rejects outright - an index key over
    # 3072 bytes being the one that already cost a deployment. A throwaway MySQL 8.4 here lets
    # `test_migrations_apply_to_a_real_mysql_database` run the whole chain against the real target
    # on every push, instead of only when a developer remembers to set TEST_MYSQL_URL.
    services:
      mysql:
        image: mysql:8.4.8
        env:
          MYSQL_ROOT_PASSWORD: ci-only-not-a-secret
          MYSQL_DATABASE: commentary_migrations
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: "npm" }
      # Resolve every production extra, including optional Entra support, during CI.
      - run: pip install -r backend/requirements.lock
      - run: pip install -c backend/requirements.lock -e './backend[dev,render,entra]'
      - run: python -m playwright install --with-deps chromium
      # The same three font packages backend/Dockerfile installs. The visual check renders a real
      # PDF and compares it with the approved report, so a runner without them is not measuring
      # this project's rendering -- it is measuring whatever Chromium fell back to. Carlito stands
      # in for Calibri (metric-compatible); the Noto CJK pair is what the Chinese variants embed.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-crosextra-carlito fonts-noto-cjk fonts-noto-cjk-extra
      - run: fc-list | grep -Ei 'carlito|notosanscjk' | sort
      # Public CA of this disposable service; the DA contract suite only accepts localhost/da_contract.
      - run: docker exec ${{ job.services.mysql.id }} cat /var/lib/mysql/ca.pem > /tmp/da-test-ca.pem
      - run: python -m pytest backend/tests -q
        env:
          # Points at the service container above, which holds nothing but these migrations - the
          # test downgrades to base before it starts.
          TEST_MYSQL_URL: mysql+pymysql://root:ci-only-not-a-secret@127.0.0.1:3306/commentary_migrations?charset=utf8mb4
          TEST_DA_REPORT_MYSQL_URL: mysql+pymysql://root:ci-only-not-a-secret@127.0.0.1:3306/da_contract
          TEST_DA_REPORT_MYSQL_CA: /tmp/da-test-ca.pem
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:host-contract --workspace @commentary/web
      - run: python scripts/check_remote_app.py
