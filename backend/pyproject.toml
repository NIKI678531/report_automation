[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "commentary-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.16,<2",
  "jinja2>=3.1,<4",
  "python-docx>=1.2,<2",
  "opencc-python-reimplemented>=0.1.7,<1",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "pymysql>=1.1,<2",
  "python-dotenv>=1.0,<2"
]

[project.optional-dependencies]
# `entra` is separate from the base install because AUTH_MODE=LOCAL never validates a signature.
# A deployment that sets AUTH_MODE=ENTRA without it fails at startup rather than at first request
# (see app.core.entra.ensure_available), so the extra cannot be forgotten silently.
entra = ["pyjwt[crypto]>=2.10,<3"]
# `storage` carries the S3-compatible client used by STORAGE_BACKEND=S3 (Volcengine TOS, MinIO,
# AWS S3). LOCAL storage needs none of it, and a deployment that selects S3 without the extra is
# told which extra to install rather than failing on an ImportError at the first download.
storage = ["boto3>=1.35,<2"]
dev = ["pytest>=8.4,<9", "pyjwt[crypto]>=2.10,<3", "PyYAML>=6,<7"]
render = ["playwright>=1.54,<2", "pypdfium2>=4.30,<5", "pillow>=11,<12"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# A skip is how this suite says "the local-only approved data is not in this checkout". `-rs`
# prints every reason, so a run that covers less than it appears to says so in its own log
# instead of looking like a clean pass.
addopts = "-rs"
