name: fund-commentary
services:
  mysql:
    image: mysql:8.4.8@sha256:2952e3be7807f06fc18de50b3ea1a632d5c70d63482ff7d7376fe3aa8999babf
    command:
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_0900_ai_ci
    - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: commentary
      MYSQL_USER: commentary
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
    tmpfs:
    - /var/lib/mysql:size=2147483648,mode=1777
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - 127.0.0.1
      interval: 5s
      timeout: 5s
      retries: 30
  migrate:
    image: fund-commentary-srvapp:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
    - path: .env
      format: raw
    environment:
      AUTH_MODE: REMOTE
      TASK_MODE: EAGER
      ALLOW_TESTING_LANE: 'false'
      DB_ECHO: 'false'
      HOME: /tmp
      TZ: Asia/Hong_Kong
      LOG_LEVEL: INFO
      DA_REPORT_CACHE_DIR: /tmp/commentary-da
      DATAWAREHOUSE_CACHE_DIR: /tmp/commentary-datawarehouse
    read_only: true
    user: 10001:10001
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:size=1073741824,mode=1777
    mem_limit: 2g
    cpus: 1
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    restart: 'no'
    command:
    - python
    - -m
    - alembic
    - upgrade
    - head
    healthcheck:
      disable: true
    depends_on:
      mysql:
        condition: service_healthy
  srvapp:
    stop_grace_period: 240s
    image: fund-commentary-srvapp:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
    - path: .env
      format: raw
    environment:
      AUTH_MODE: REMOTE
      TASK_MODE: EAGER
      ALLOW_TESTING_LANE: 'false'
      DB_ECHO: 'false'
      HOME: /tmp
      TZ: Asia/Hong_Kong
      LOG_LEVEL: INFO
      DA_REPORT_CACHE_DIR: /tmp/commentary-da
      DATAWAREHOUSE_CACHE_DIR: /tmp/commentary-datawarehouse
    read_only: true
    user: 10001:10001
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:size=1073741824,mode=1777
    mem_limit: 2g
    cpus: 1
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    restart: 'no'
    depends_on:
      migrate:
        condition: service_completed_successfully
  webapp:
    image: fund-commentary-webapp:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_UPSTREAM: srvapp:8000
    read_only: true
    user: 101:101
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:size=268435456,mode=1777
    - /etc/nginx/conf.d:size=1048576,mode=1777
    ports:
    - 127.0.0.1:3030:3030
    depends_on:
      srvapp:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    restart: 'no'
