services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: commentary
      MYSQL_USER: commentary
      MYSQL_PASSWORD: local-only-change-me
      MYSQL_ROOT_PASSWORD: local-root-change-me
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "localhost"], interval: 5s, timeout: 3s, retries: 20 }
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
  api:
    build: { context: ./backend, dockerfile: Dockerfile }
    environment:
      DATABASE_URL: mysql+pymysql://commentary:local-only-change-me@db/commentary
      AUTH_MODE: LOCAL
      TASK_MODE: CELERY
      REDIS_URL: redis://redis:6379/0
      DOWNLOAD_SECRET: local-compose-secret-change-me
      NEWS_PROVIDER: ${NEWS_PROVIDER:-DA_REPORT}
      MARKETAUX_API_KEY: ${MARKETAUX_API_KEY:-}
      MARKETAUX_BASE_URL: ${MARKETAUX_BASE_URL:-https://api.marketaux.com/v1}
      DA_REPORT_SQLITE_PATH: ${DA_REPORT_SQLITE_PATH:-}
      DA_REPORT_SQLITE_SHA256: ${DA_REPORT_SQLITE_SHA256:-}
      DA_REPORT_OBJECT_URL: ${DA_REPORT_OBJECT_URL:-}
      DA_REPORT_CACHE_DIR: /tmp/commentary-da
      DATAWAREHOUSE_PERFORMANCE_ENABLED: ${DATAWAREHOUSE_PERFORMANCE_ENABLED:-true}
      DATAWAREHOUSE_MYSQL_HOST: ${DATAWAREHOUSE_MYSQL_HOST:-}
      DATAWAREHOUSE_MYSQL_PORT: ${DATAWAREHOUSE_MYSQL_PORT:-3306}
      DATAWAREHOUSE_MYSQL_DATABASE: ${DATAWAREHOUSE_MYSQL_DATABASE:-}
      DATAWAREHOUSE_MYSQL_USERNAME: ${DATAWAREHOUSE_MYSQL_USERNAME:-}
      DATAWAREHOUSE_MYSQL_PASSWORD: ${DATAWAREHOUSE_MYSQL_PASSWORD:-}
      DATAWAREHOUSE_MYSQL_SSL_CA: ${DATAWAREHOUSE_MYSQL_SSL_CA:-}
      DATAWAREHOUSE_MYSQL_SSL_VERIFY_IDENTITY: ${DATAWAREHOUSE_MYSQL_SSL_VERIFY_IDENTITY:-true}
      DATAWAREHOUSE_CLASS_MASTER_VIEW: ${DATAWAREHOUSE_CLASS_MASTER_VIEW:-view_ads_busi_product_fundinfo_class_f_p}
      DATAWAREHOUSE_FUND_RETURNS_VIEW: ${DATAWAREHOUSE_FUND_RETURNS_VIEW:-view_ads_busi_performance_class_returns_f_p}
      DATAWAREHOUSE_INDEX_RETURNS_VIEW: ${DATAWAREHOUSE_INDEX_RETURNS_VIEW:-view_ads_busi_performance_index_returns_f_p}
      DATAWAREHOUSE_SQLITE_PATH: ${DATAWAREHOUSE_SQLITE_PATH:-}
      DATAWAREHOUSE_SQLITE_SHA256: ${DATAWAREHOUSE_SQLITE_SHA256:-}
      DATAWAREHOUSE_OBJECT_URL: ${DATAWAREHOUSE_OBJECT_URL:-}
      DATAWAREHOUSE_CACHE_DIR: /tmp/commentary-datawarehouse
      FMP_CONSTITUENT_RETURNS_ENABLED: ${FMP_CONSTITUENT_RETURNS_ENABLED:-true}
      FMP_API_KEY: ${FMP_API_KEY:-}
      FMP_BASE_URL: ${FMP_BASE_URL:-https://financialmodelingprep.com/stable}
      FMP_TIMEOUT_SECONDS: ${FMP_TIMEOUT_SECONDS:-20}
      FMP_BOUNDARY_LOOKBACK_DAYS: ${FMP_BOUNDARY_LOOKBACK_DAYS:-14}
      FMP_ALLOWED_HOSTS: ${FMP_ALLOWED_HOSTS:-financialmodelingprep.com}
    volumes: ["./var/output:/app/var/output"]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
  worker:
    build: { context: ./backend, dockerfile: Dockerfile }
    command: ["celery", "-A", "app.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment:
      DATABASE_URL: mysql+pymysql://commentary:local-only-change-me@db/commentary
      TASK_MODE: CELERY
      REDIS_URL: redis://redis:6379/0
      DOWNLOAD_SECRET: local-compose-secret-change-me
      DATAWAREHOUSE_PERFORMANCE_ENABLED: ${DATAWAREHOUSE_PERFORMANCE_ENABLED:-true}
      DATAWAREHOUSE_MYSQL_HOST: ${DATAWAREHOUSE_MYSQL_HOST:-}
      DATAWAREHOUSE_MYSQL_PORT: ${DATAWAREHOUSE_MYSQL_PORT:-3306}
      DATAWAREHOUSE_MYSQL_DATABASE: ${DATAWAREHOUSE_MYSQL_DATABASE:-}
      DATAWAREHOUSE_MYSQL_USERNAME: ${DATAWAREHOUSE_MYSQL_USERNAME:-}
      DATAWAREHOUSE_MYSQL_PASSWORD: ${DATAWAREHOUSE_MYSQL_PASSWORD:-}
      DATAWAREHOUSE_MYSQL_SSL_CA: ${DATAWAREHOUSE_MYSQL_SSL_CA:-}
      DATAWAREHOUSE_MYSQL_SSL_VERIFY_IDENTITY: ${DATAWAREHOUSE_MYSQL_SSL_VERIFY_IDENTITY:-true}
      DATAWAREHOUSE_CLASS_MASTER_VIEW: ${DATAWAREHOUSE_CLASS_MASTER_VIEW:-view_ads_busi_product_fundinfo_class_f_p}
      DATAWAREHOUSE_FUND_RETURNS_VIEW: ${DATAWAREHOUSE_FUND_RETURNS_VIEW:-view_ads_busi_performance_class_returns_f_p}
      DATAWAREHOUSE_INDEX_RETURNS_VIEW: ${DATAWAREHOUSE_INDEX_RETURNS_VIEW:-view_ads_busi_performance_index_returns_f_p}
    volumes: ["./var/output:/app/var/output"]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
  web:
    build: { context: ., dockerfile: frontend/Dockerfile }
    ports: ["8080:80"]
    depends_on: [api]
volumes:
  mysql-data:
  redis-data:
