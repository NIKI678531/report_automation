services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: commentary
      MYSQL_USER: commentary
      MYSQL_PASSWORD: local-only-change-me
      MYSQL_ROOT_PASSWORD: local-root-change-me
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "localhost"], interval: 5s, timeout: 3s, retries: 20 }
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
  api:
    build: { context: ./backend, dockerfile: Dockerfile }
    environment:
      DATABASE_URL: mysql+pymysql://commentary:local-only-change-me@db/commentary
      AUTH_MODE: LOCAL
      TASK_MODE: CELERY
      REDIS_URL: redis://redis:6379/0
      DOWNLOAD_SECRET: local-compose-secret-change-me
      NEWS_PROVIDER: ${NEWS_PROVIDER:-DA_REPORT}
      MARKETAUX_API_KEY: ${MARKETAUX_API_KEY:-}
      MARKETAUX_BASE_URL: ${MARKETAUX_BASE_URL:-https://api.marketaux.com/v1}
      DA_REPORT_SQLITE_PATH: ${DA_REPORT_SQLITE_PATH:-}
      DA_REPORT_SQLITE_SHA256: ${DA_REPORT_SQLITE_SHA256:-}
      DA_REPORT_OBJECT_URL: ${DA_REPORT_OBJECT_URL:-}
      DA_REPORT_CACHE_DIR: /tmp/commentary-da
    volumes: ["./var/output:/app/var/output"]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
  worker:
    build: { context: ./backend, dockerfile: Dockerfile }
    command: ["celery", "-A", "app.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment:
      DATABASE_URL: mysql+pymysql://commentary:local-only-change-me@db/commentary
      TASK_MODE: CELERY
      REDIS_URL: redis://redis:6379/0
      DOWNLOAD_SECRET: local-compose-secret-change-me
    volumes: ["./var/output:/app/var/output"]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
  web:
    build: { context: ., dockerfile: frontend/Dockerfile }
    ports: ["8080:80"]
    depends_on: [api]
volumes:
  mysql-data:
  redis-data:
