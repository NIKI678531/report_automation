x-trial-runtime: &trial-runtime
  restart: "no"
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    <<: *trial-runtime
  redis:
    <<: *trial-runtime
  api:
    <<: *trial-runtime
    image: commentary-api:${RELEASE_TAG:-trial}
  worker:
    <<: *trial-runtime
    image: commentary-api:${RELEASE_TAG:-trial}
  web:
    <<: *trial-runtime
    image: commentary-web:${RELEASE_TAG:-trial}
    ports: !override
      - "127.0.0.1:${VM_HTTP_PORT:-18080}:80"