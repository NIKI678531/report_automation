server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Dataset uploads are CSV/XLSX exports that routinely run to several megabytes, and nginx's
  # 1 MB default would reject them with a bare HTML 413 before FastAPI could answer with the
  # structured envelope the UI knows how to display. Keep this at or above UPLOAD_MAX_BYTES.
  client_max_body_size 100m;
  client_body_timeout 120s;
  # The API is the only thing that should announce this server's identity.
  server_tokens off;

  # Headers are set per location rather than on the server: an `add_header` here would also apply
  # to the proxied API, and a second Content-Security-Policy is intersected with the first - the
  # product-UI policy would then block the data: fonts and images in the report preview document.
  location / {
    try_files $uri /index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # Clickjacking: the workbench finalizes reports, so it must never be framed by another origin.
    add_header X-Frame-Options DENY always;
    # Vite emits hashed bundles, so no inline script is needed; styles stay 'unsafe-inline'
    # because the design tokens are applied as inline custom properties. `connect-src 'self'` is
    # sufficient because the API is same-origin through this proxy.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
  }

  # No add_header here: app.core.security.AuthorizationMiddleware already sets the security
  # headers on every API response, and picks a policy that matches the response's content type.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Host $host;
    # Without these the application logs every caller as the proxy's own address, and any future
    # rate limit or audit trail would attribute all traffic to one client.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    # A Chromium PDF render of a full report takes longer than the 60s default.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }
}
