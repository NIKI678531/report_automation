apiVersion: v1
kind: ConfigMap
metadata:
  name: ih-prd-remote-fund-cmt-auto-srvapp-config
  namespace: ih
  labels: {app: ih-prd-remote-fund-cmt-auto, component: srvapp, env: prd}
data:
  TZ: Asia/Hong_Kong
  HOME: /tmp
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  AUTH_MODE: ENTRA
  STORAGE_BACKEND: S3
  TASK_MODE: CELERY
  ALLOW_TESTING_LANE: "false"
  DB_ECHO: "false"
  ENTRA_TENANT_ID: REPLACE-ME-TENANT-ID
  ENTRA_AUDIENCE: REPLACE-ME-API-AUDIENCE
  ENTRA_ROLE_CLAIM: roles
  ENTRA_PRODUCT_SCOPE_CLAIM: product_scope
  ENTRA_ALLOWED_ALGORITHMS: RS256
  CORS_ALLOW_ORIGINS: https://replace-me-prd.example.invalid
  S3_BUCKET: REPLACE-ME-PRD-BUCKET
  S3_ENDPOINT_URL: https://replace-me-storage.example.invalid
  S3_REGION: REPLACE-ME-REGION
  S3_PREFIX: fund-commentary/prd
  S3_ADDRESSING_STYLE: virtual
  DB_POOL_PRE_PING: "true"
  DB_POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "5"
  DB_POOL_RECYCLE_SECONDS: "1800"
  DB_POOL_TIMEOUT_SECONDS: "30"
  DB_CONNECT_TIMEOUT_SECONDS: "10"
  UPLOAD_MAX_BYTES: "20971520"
  UPLOAD_BATCH_MAX_BYTES: "104857600"
  UPLOAD_BATCH_MAX_FILES: "20"
  NEWS_PROVIDER: DA_REPORT
  DA_REPORT_CACHE_DIR: /tmp/commentary-da
  DA_REPORT_AUTO_LOAD: "true"
  DATAWAREHOUSE_PERFORMANCE_ENABLED: "true"
  DATAWAREHOUSE_CONSTITUENTS_ENABLED: "true"
  DATAWAREHOUSE_MYSQL_PORT: "3306"
  DATAWAREHOUSE_MYSQL_SSL_CA: /etc/ssl/certs/ca-certificates.crt
  DATAWAREHOUSE_MYSQL_SSL_VERIFY_IDENTITY: "true"
  DATAWAREHOUSE_CLASS_MASTER_VIEW: view_ads_busi_product_fundinfo_class_f_p
  DATAWAREHOUSE_FUND_RETURNS_VIEW: view_ads_busi_performance_class_returns_f_p
  DATAWAREHOUSE_INDEX_RETURNS_VIEW: view_ads_busi_performance_index_returns_f_p
  DATAWAREHOUSE_CONSTITUENTS_VIEW: view_ads_busi_market_index_constituent_price_daily_f_p
  DATAWAREHOUSE_FUND_AUM_VIEW: view_ads_busi_valuation_nav_fund_level_exposure_1_f_p
  DATAWAREHOUSE_FUND_KPI_VIEW: ""
  DATAWAREHOUSE_CACHE_DIR: /tmp/commentary-datawarehouse
  FMP_CONSTITUENT_RETURNS_ENABLED: "true"
  FMP_BASE_URL: https://financialmodelingprep.com/stable
  FMP_TIMEOUT_SECONDS: "20"
  FMP_BOUNDARY_LOOKBACK_DAYS: "14"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ih-prd-remote-fund-cmt-auto-webapp-config
  namespace: ih
  labels: {app: ih-prd-remote-fund-cmt-auto, component: webapp, env: prd}
data:
  TZ: Asia/Hong_Kong
  API_UPSTREAM: ih-prd-remote-fund-cmt-auto-srvapp:8000
  SERVER_NAME: replace-me-prd.example.invalid
  NGINX_ENVSUBST_FILTER: "^(API_UPSTREAM|SERVER_NAME)$"