apiVersion: apps/v1
kind: Deployment
metadata:
  name: ih-prd-remote-fund-cmt-auto-srvapp
  namespace: ih
  labels:
    app: ih-prd-remote-fund-cmt-auto
    component: srvapp
    env: prd
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ih-prd-remote-fund-cmt-auto
      component: srvapp
  template:
    metadata:
      labels:
        app: ih-prd-remote-fund-cmt-auto
        component: srvapp
        env: prd
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 180
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: 449732370091.dkr.ecr.ap-east-1.amazonaws.com/ih-prd-remote-fund-cmt-auto-srvapp:replace-me-release
          imagePullPolicy: Always
          args: ["python", "-m", "alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: ih-prd-remote-fund-cmt-auto-srvapp-config
            - secretRef:
                name: ih-prd-remote-fund-cmt-auto-srvapp-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "1", memory: "1Gi"}
          volumeMounts:
            - {name: api-tmp, mountPath: /tmp}
            - {name: api-output, mountPath: /app/var/output}
      containers:
        - name: srvapp
          image: 449732370091.dkr.ecr.ap-east-1.amazonaws.com/ih-prd-remote-fund-cmt-auto-srvapp:replace-me-release
          imagePullPolicy: Always
          args: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-proxy-headers", "--timeout-graceful-shutdown", "150"]
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef:
                name: ih-prd-remote-fund-cmt-auto-srvapp-config
            - secretRef:
                name: ih-prd-remote-fund-cmt-auto-srvapp-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet: {path: /api/v1/health, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /api/v1/health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /api/v1/health, port: http}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: "250m", memory: "512Mi"}
            limits: {cpu: "2", memory: "2Gi"}
          volumeMounts:
            - {name: api-tmp, mountPath: /tmp}
            - {name: api-output, mountPath: /app/var/output}
        - name: worker
          image: 449732370091.dkr.ecr.ap-east-1.amazonaws.com/ih-prd-remote-fund-cmt-auto-srvapp:replace-me-release
          imagePullPolicy: Always
          args: ["celery", "-A", "app.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=2", "--pidfile=/tmp/celery.pid"]
          envFrom:
            - configMapRef:
                name: ih-prd-remote-fund-cmt-auto-srvapp-config
            - secretRef:
                name: ih-prd-remote-fund-cmt-auto-srvapp-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            exec:
              command: ["sh", "-c", "test -s /tmp/celery.pid && kill -0 \"$(cat /tmp/celery.pid)\""]
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            exec:
              command: ["sh", "-c", "test -s /tmp/celery.pid && kill -0 \"$(cat /tmp/celery.pid)\""]
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "test -s /tmp/celery.pid && kill -0 \"$(cat /tmp/celery.pid)\""]
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: "500m", memory: "1Gi"}
            limits: {cpu: "2", memory: "3Gi"}
          volumeMounts:
            - {name: worker-tmp, mountPath: /tmp}
            - {name: worker-output, mountPath: /app/var/output}
      volumes:
        - name: api-tmp
          emptyDir: {sizeLimit: 768Mi}
        - name: api-output
          emptyDir: {sizeLimit: 512Mi}
        - name: worker-tmp
          emptyDir: {sizeLimit: 768Mi}
        - name: worker-output
          emptyDir: {sizeLimit: 512Mi}