apiVersion: apps/v1
kind: Deployment
metadata:
  name: ih-prd-remote-fund-cmt-auto-srvapp
  namespace: ih
  labels:
    app: ih-prd-remote-fund-cmt-auto
    component: srvapp
    env: prd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ih-prd-remote-fund-cmt-auto
      component: srvapp
  template:
    metadata:
      labels:
        app: ih-prd-remote-fund-cmt-auto
        component: srvapp
        env: prd
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 240
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: srvapp
        image: 449732370091.dkr.ecr.ap-east-1.amazonaws.com/ih-prd-remote-fund-cmt-auto-srvapp:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
        envFrom:
        - configMapRef:
            name: ih-prd-remote-fund-cmt-auto-srvapp-config
        - secretRef:
            name: ih-prd-remote-fund-cmt-auto-srvapp-secret
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: output
          mountPath: /app/var/output
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        startupProbe:
          httpGet:
            path: /api/v1/health
            port: http
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 36
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
      - name: output
        emptyDir:
          sizeLimit: 1Gi
      initContainers:
      - name: migrate
        image: 449732370091.dkr.ecr.ap-east-1.amazonaws.com/ih-prd-remote-fund-cmt-auto-srvapp:latest
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: ih-prd-remote-fund-cmt-auto-srvapp-config
        - secretRef:
            name: ih-prd-remote-fund-cmt-auto-srvapp-secret
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: output
          mountPath: /app/var/output
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        args:
        - python
        - -m
        - alembic
        - upgrade
        - head
