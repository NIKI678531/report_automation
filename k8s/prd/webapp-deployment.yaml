apiVersion: apps/v1
kind: Deployment
metadata:
  name: ih-prd-remote-fund-cmt-auto-webapp
  namespace: ih
  labels: {app: ih-prd-remote-fund-cmt-auto, component: webapp, env: prd}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: ih-prd-remote-fund-cmt-auto, component: webapp}
  template:
    metadata:
      labels: {app: ih-prd-remote-fund-cmt-auto, component: webapp, env: prd}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webapp
          image: 449732370091.dkr.ecr.ap-east-1.amazonaws.com/ih-prd-remote-fund-cmt-auto-webapp:replace-me-release
          imagePullPolicy: Always
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef:
                name: ih-prd-remote-fund-cmt-auto-webapp-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests: {cpu: "50m", memory: "64Mi"}
            limits: {cpu: "500m", memory: "256Mi"}
          volumeMounts:
            - {name: nginx-conf, mountPath: /etc/nginx/conf.d}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: nginx-conf
          emptyDir: {sizeLimit: 1Mi}
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}