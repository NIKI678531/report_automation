[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "commentary-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.16,<2",
  "jinja2>=3.1,<4",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "pymysql>=1.1,<2",
  "celery[redis]>=5.5,<6"
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9"]
render = ["playwright>=1.54,<2", "pypdfium2>=4.30,<5", "pillow>=11,<12"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
